<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Perk Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#1b1410;color:#f4e1c4;font-family:Garamond,'Palatino Linotype',serif;font-size:17px;}
header{padding:18px 24px;background:#120e0b;border-bottom:1px solid #6b5438;position:sticky;top:0;z-index:20;}
h1{margin:0;font-size:32px;color:#fec157;}
.layout{display:grid;grid-template-columns:260px 1fr 360px;min-height:calc(100vh - 78px);}
nav{border-right:1px solid #5a4630;background:#160f0c;padding:14px;overflow:auto;}
.nav-title{color:#c9b08a;font-size:14px;letter-spacing:1px;margin:4px 4px 12px;text-transform:uppercase;}
nav input{width:100%;background:#2a2018;color:#f4e1c4;border:1px solid #6b5438;padding:10px 12px;margin-bottom:10px;font-size:16px;}
.skill{padding:10px 12px;margin:3px 0;border:1px solid transparent;color:#c9b08a;cursor:pointer;font-size:17px;}
.skill:hover{background:#221912;border-color:#6b5438;}
.skill.active{color:#fec157;background:#2a2018;border-color:#8a7048;box-shadow:inset 3px 0 #fec157;}
main{padding:22px 26px;overflow:auto;}
.skill-head{margin-bottom:18px;}
.skill-name{font-size:34px;color:#fec157;}
.skill-info{font-size:16px;color:#c9b08a;margin-top:6px;}
.tier{margin:0 0 26px;}
.tier-label{display:flex;align-items:center;gap:12px;color:#c9b08a;font-size:15px;margin-bottom:10px;}
.tier-label:after{content:"";height:1px;background:#5a4630;flex:1;}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.perk{position:relative;min-height:150px;padding:14px 14px 14px 84px;background:#221912;border:1px solid #6b5438;cursor:pointer;}
.perk:hover{border-color:#a89070;}
.perk.selected{border-color:#fec157;box-shadow:inset 0 0 0 1px #fec157;}
.icon{position:absolute;left:14px;top:14px;width:56px;height:60px;object-fit:contain;}
.choice{font-size:13px;color:#a89070;text-transform:uppercase;letter-spacing:1px;}
.name{font-size:20px;color:#f4e1c4;margin:6px 0 10px;}
.desc{font-size:15px;color:#c9b08a;line-height:1.45;white-space:pre-line;}
.right{border-left:1px solid #5a4630;background:#160f0c;padding:16px;position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto;}
.card{background:#221912;border:1px solid #6b5438;padding:14px;margin-bottom:14px;}
.card h3{margin:0 0 12px;font-size:18px;color:#fec157;}
.build{font:22px Consolas,monospace;letter-spacing:3px;color:#fec157;word-break:break-all;}
.command{font:15px Consolas,monospace;color:#f4e1c4;background:#120e0b;border:1px solid #5a4630;padding:12px;word-break:break-all;}
button{font:15px Segoe UI,Arial,sans-serif;color:#f4e1c4;background:#2a2018;border:1px solid #8a7048;padding:10px 14px;cursor:pointer;}
button:hover{background:#3a2c20;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.status{font-size:15px;color:#9fdf7a;min-height:18px;margin-top:10px;}
.hint{font-size:14px;color:#c9b08a;line-height:1.45;margin-top:8px;}
@media(max-width:1100px){.layout{grid-template-columns:200px 1fr}.right{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid #5a4630}}
@media(max-width:720px){.layout{display:block}nav{max-height:220px}.pair{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Конструктор перков</h1></header>
<div class="layout"><nav><div class="nav-title">Навыки</div>
<input id="search" placeholder="Поиск..."/>
<div id="skills"></div></nav>
<main><div class="skill-head"><div id="title" class="skill-name"></div>
<div id="skillInfo" class="skill-info">Выберите один перк на каждом уровне. 1 — первый вариант, 2 — второй, 0 — без выбора.</div></div>
<div id="perks"></div></main>
<aside class="right">
<div class="card"><h3>Текущий билд</h3><div id="build" class="build"></div>
<div class="hint">0 = на этом уровне выбор не сделан.</div></div>
<div class="card"><h3>Команда Twitch</h3><div id="command" class="command"></div>
<div class="actions"><button type="button" onclick="copyCommand()">Скопировать</button>
<button type="button" onclick="resetSkill()">Сбросить навык</button>
<button type="button" onclick="copyReset()">Скопировать !перки сброс</button></div>
<div id="status" class="status"></div></div>
</aside></div><script>
var DATA={"Crossbow":{id:"Crossbow",name:"Арбалет",tiers:[{level:25,choices:[{choice:1,id:"CrossbowMarksmen",name:"Снайперы",desc:"(Личные) Скорость прицеливания из арбалетов: +25%.\n(Лидер отряда) Боевой дух воинов дальнего боя в вашем отряде в начале битвы: +10%.",icon:"perk-icons/CrossbowMarksmen.png"},{choice:2,id:"CrossbowPiercer",name:"Пробойник",desc:"(Личные) Ваши болты игнорируют броню, если ее значение меньше 20.\n(Лидер отряда) Стоимость найма воинов дальнего боя: -20%.",icon:"perk-icons/CrossbowPiercer.png"}]},{level:50,choices:[{choice:1,id:"CrossbowUnhorser",name:"Гроза всадников",desc:"(Личные) Урон ездовым животным из арбалета: +40%.\n(Командир) Урон, наносимый ездовым животным арбалетчиками вашего подразделения: +20%.",icon:"perk-icons/CrossbowUnhorser.png"},{choice:2,id:"CrossbowWindWinder",name:"Быстрее ветра",desc:"(Личные) Скорость перезарядки арбалетов: +25%.\n(Командир) Скорость перезарядки арбалетов у воинов вашего подразделения: +5%.",icon:"perk-icons/CrossbowWindWinder.png"}]},{level:75,choices:[{choice:1,id:"CrossbowDonkeysSwiftness",name:"Проворство ишака",desc:"(Личные) Снижение точности при передвижении: -30%.\n(Командир) Навык стрельбы из арбалета у воинов вашего подразделения: +30.",icon:"perk-icons/CrossbowDonkeysSwiftness.png"},{choice:2,id:"CrossbowSheriff",name:"Шериф",desc:"(Личные) Урон выстрелами в голову из арбалетов: +50%.\n(Командир) Урон, наносимый пешим воинам арбалетчиками вашего подразделения: +10%.",icon:"perk-icons/CrossbowSheriff.png"}]},{level:100,choices:[{choice:1,id:"CrossbowPeasantLeader",name:"Предводитель крестьян",desc:"(Лидер отряда) Боевой дух воинов класса 1-3: +10%.\n(Наместник) Затраты на содержание воинов дальнего боя в гарнизоне подконтрольного поселения: -20%.",icon:"perk-icons/CrossbowPeasantLeader.png"},{choice:2,id:"CrossbowRenownMarksmen",name:"Прославленные стрелки",desc:"(Лидер отряда) Ежедневный опыт воинов дальнего боя в вашем отряде: +2.\n(Наместник) Безопасность, обеспечиваемая воинами дальнего боя в гарнизоне подконтрольного поселения: +30%.",icon:"perk-icons/CrossbowRenownMarksmen.png"}]},{level:125,choices:[{choice:1,id:"CrossbowFletcher",name:"Мастер по изготовлению луков и стрел",desc:"(Личные) Болты в колчане: +4.\n(Лидер отряда) Болты в колчане каждого воина вашего отряда: +2.",icon:"perk-icons/CrossbowFletcher.png"},{choice:2,id:"CrossbowPuncture",name:"Прокол",desc:"(Личные) Пробитие брони арбалетами: +10%.\n(Командир) Пробитие брони арбалетами воинов вашего подразделения: +5%.",icon:"perk-icons/CrossbowPuncture.png"}]},{level:150,choices:[{choice:1,id:"CrossbowDeftHands",name:"Быстрые руки",desc:"(Личные) Сопротивление ошеломлению при перезарядке арбалета: +50%.\n(Командир) Сопротивление ошеломлению при перезарядке арбалетов воинами вашего подразделения: +50%.",icon:"perk-icons/CrossbowDeftHands.png"},{choice:2,id:"CrossbowLooseAndMove",name:"Свобода действий",desc:"(Личные) Использование арбалетов не замедляет вас.\n(Командир) Скорость передвижения воинов дальнего боя в вашем подразделении: +5%.",icon:"perk-icons/CrossbowLooseAndMove.png"}]},{level:175,choices:[{choice:1,id:"CrossbowCounterFire",name:"Встречный огонь",desc:"(Личные) Получаемый урон от снарядов при использовании арбалета: -10%.\n(Командир) Урон от метательных снарядов ваших воинов: -3%.",icon:"perk-icons/CrossbowCounterFire.png"},{choice:2,id:"CrossbowMountedCrossbowman",name:"Конный арбалетчик",desc:"(Личные) Вы можете перезаряжать любой арбалет на скаку.\n(Лидер отряда) Опыт, получаемый воинами дальнего боя в вашем отряде: +5%.",icon:"perk-icons/CrossbowMountedCrossbowman.png"}]},{level:200,choices:[{choice:1,id:"CrossbowLongShots",name:"Дальние выстрелы",desc:"(Личные) Приближение для арбалетов: +100%.\n(Наместник) Ежедневный наем ополчения в подконтрольном поселении: +1.",icon:"perk-icons/CrossbowLongShots.png"},{choice:2,id:"CrossbowSteady",name:"Стабильный рост",desc:"(Личные) Штраф к точности арбалетов при езде верхом: -50%.\n(Наместник) Поступления от пошлин в подконтрольном поселении: +5%.",icon:"perk-icons/CrossbowSteady.png"}]},{level:225,choices:[{choice:1,id:"CrossbowHammerBolts",name:"Ударные болты",desc:"(Личные) Арбалеты теперь могут выбивать всадников из седла и игнорируют +50% сопротивляемости выбросу из седла при атаках против всадников.\n(Командир) Урон, наносимый арбалетчиками вашего подразделения: +10%.",icon:"perk-icons/CrossbowHammerBolts.png"},{choice:2,id:"CrossbowPavise",name:"Павеза",desc:"(Личные) Шанс блокировать атаку дальнего боя с тыла щитом на спине: +75%.\n(Наместник) Точность баллист в подконтрольном поселении: +30%.",icon:"perk-icons/CrossbowPavise.png"}]},{level:250,choices:[{choice:1,id:"CrossbowBoltenGuard",name:"Отборные стрелки",desc:"(Лидер отряда) Затраты на воинов дальнего боя класса 4 и выше: -50%.\n(Лидер отряда) Здоровье воинов дальнего боя в вашем отряде: +5.",icon:"perk-icons/CrossbowBoltenGuard.png"},{choice:2,id:"CrossbowTerror",name:"Ужас",desc:"(Лидер отряда) Шанс увеличить число жертв от каждого попадания при обстреле во время осады на 1: +20%.\n(Командир) Потеря боевого духа врагами при убийствах из арбалета, совершенных воинами вашего подразделения: +25%.",icon:"perk-icons/CrossbowTerror.png"}]},{level:275,choices:[{choice:1,id:"CrossbowMightyPull",name:"Тугая тетива",desc:"(Личные) Скорость перезарядки арбалетов за каждое очко навыка свыше 200: +0.2%.\n(Личные) Урон выстрелами из арбалетов за каждое очко навыка свыше 200: +0.5%.",icon:"perk-icons/CrossbowMightyPull.png"}]}]},"Athletics":{id:"Athletics",name:"Атлетичность",tiers:[{level:25,choices:[{choice:1,id:"AthleticsMorningExercise",name:"Утренняя зарядка",desc:"(Личные) Скорость передвижения в бою: +3%.\n(Командир) Скорость передвижения воинов вашего подразделения в бою: +5%.",icon:"perk-icons/AthleticsMorningExercise.png"},{choice:2,id:"AthleticsWellBuilt",name:"Хорошее сложение",desc:"(Личные) Очки здоровья: +5.\n(Лидер отряда) Здоровье пеших воинов в вашем отряде: +5.",icon:"perk-icons/AthleticsWellBuilt.png"}]},{level:50,choices:[{choice:1,id:"AthleticsFormFittingArmor",name:"Подогнанная броня",desc:"(Личные) Вес брони: -15%.\n(Командир) Скорость передвижения пеших воинов класса 3 и выше из вашего подразделения в бою: +4%.",icon:"perk-icons/AthleticsFormFittingArmor.png"},{choice:2,id:"AthleticsFury",name:"Ярость",desc:"(Личные) Сбалансированность оружия при ходьбе: +10%.\n(Командир) Сбалансированность оружия пеших воинов вашего подразделения: +10%.",icon:"perk-icons/AthleticsFury.png"}]},{level:75,choices:[{choice:1,id:"AthleticsImposingStature",name:"Внушительная комплекция",desc:"(Личные) Шанс убеждения: +30%.\n(Лидер отряда) Размер отряда: +5.",icon:"perk-icons/AthleticsImposingStature.png"},{choice:2,id:"AthleticsStamina",name:"Выносливость",desc:"(Личные) Восстановление расхода выносливости для ремесел: +50%.\n(Лидер отряда) Максимум пленников: +5. Снижение шанса побега ваших пленников на 10%.",icon:"perk-icons/AthleticsStamina.png"}]},{level:100,choices:[{choice:1,id:"AthleticsPowerful",name:"Могущественная персона",desc:"(Личные) Урон оружием ближнего боя: +4%.\n(Командир) Урон, наносимый воинами вашего подразделения в ближнем бою: +2%.",icon:"perk-icons/AthleticsPowerful.png"},{choice:2,id:"AthleticsSprint",name:"Рывок",desc:"(Личные) Скорость передвижения в бою без щитов и оружия дальнего боя: +5%.\n(Командир) Скорость передвижения пеших воинов вашего подразделения в бою: +3%.",icon:"perk-icons/AthleticsSprint.png"}]},{level:125,choices:[{choice:1,id:"AthleticsBraced",name:"Укрепленный обручем",desc:"(Личные) Получаемый урон при столкновении: -40%.\n(Командир) Урон, получаемый воинами вашего подразделения при столкновении с врагом: -30%.",icon:"perk-icons/AthleticsBraced.png"},{choice:2,id:"AthleticsSurgingBlow",name:"Сокрушительный удар",desc:"(Личные) Скоростной урон пешком: +30%.\n(Командир) Скоростной урон воинов вашего подразделения: +30%.",icon:"perk-icons/AthleticsSurgingBlow.png"}]},{level:150,choices:[{choice:1,id:"AthleticsAGoodDaysRest",name:"День отдыха",desc:" ии: +1.",icon:"perk-icons/ThrowingSlingingCompetitions.png"}]},{level:200,choices:[{choice:1,id:"ThrowingResourceful",name:"Запасливый",desc:"(Личные) Запас метательных снарядов: +2.\n(Лидер отряда) Опыт, получаемый в битвах воинами вашего отряда, использующими метательное оружие: +10%.",icon:"perk-icons/ThrowingResourceful.png"},{choice:2,id:"ThrowingSplinters",name:"Щепки летят",desc:"(Личные) Тройной урон щитам метательными топорами.\n(Командир) Урон, наносимый щитам метательным оружием воинов вашего подразделения: +50%.",icon:"perk-icons/ThrowingSplinters.png"}]},{level:225,choices:[{choice:1,id:"ThrowingLongReach",name:"Большая досягаемость",desc:"(Личные) Вы можете подбирать с земли предметы, не спешиваясь.\n(Лидер отряда) Боевой дух и известность за победы в битвах: +20%.",icon:"perk-icons/ThrowingLongReach.png"},{choice:2,id:"ThrowingPerfectTechnique",name:"Идеальная техника",desc:"(Личные) Скорость полета снарядов вашего метательного оружия: +25%.\n(Командир) Скорость полета снарядов метательного оружия воинов вашего подразделения: +10%.",icon:"perk-icons/ThrowingPerfectTechnique.png"}]},{level:250,choices:[{choice:1,id:"ThrowingImpale",name:"Пронзающий удар",desc:"(Личные) Метаемые вами дротики могут пробивать щиты.\n(Командир) Урон метательным оружием воинов вашего подразделения: +10%.",icon:"perk-icons/ThrowingImpale.png"},{choice:2,id:"ThrowingWeakSpot",name:"Уязвимое место",desc:"(Личные) Пробитие брони метательным оружием: +30%.\n(Командир) Пробитие брони метательным оружием воинов вашего подразделения: +10%.",icon:"perk-icons/ThrowingWeakSpot.png"}]},{level:275,choices:[{choice:1,id:"ThrowingUnstoppableForce",name:"Непреодолимая сила",desc:"(Личные) Скорость полета снарядов метательного оружия за каждое очко навыка свыше 200: +0.2%.\n(Личные) Урон метательным оружием за каждое очко навыка свыше 200: +0.5%.",icon:"perk-icons/ThrowingUnstoppableForce.png"}]}]},"Roguery":{id:"Roguery",name:"Мошенничество",tiers:[{level:25,choices:[{choice:1,id:"RogueryN skillIds.forEach(function(id){selected[id]=new Array(DATA[id].tiers.length).fill(0);});
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m];});}
function renderSkills(filter){
 filter=(filter||'').toLowerCase();
 var box=document.getElementById('skills'); box.innerHTML='';
 skillIds.filter(function(id){
  var s=DATA[id]; return !filter || s.name.toLowerCase().indexOf(filter)>=0 || id.toLowerCase().indexOf(filter)>=0;
 }).forEach(function(id){
  var d=document.createElement('div');
  d.className='skill'+(id===current?' active':'');
  d.textContent=DATA[id].name;
  d.onclick=function(){current=id;renderSkills(document.getElementById('search').value);render();};
  box.appendChild(d);
 });
}
function render(){
 if(!current||!DATA[current])return;
 var skill=DATA[current];
 document.getElementById('title').textContent=skill.name;
 var box=document.getElementById('perks'); box.innerHTML='';
 skill.tiers.forEach(function(tier,ti){
  var row=document.createElement('div'); row.className='tier';
  row.innerHTML='<div class="tier-label"><span>УРОВЕНЬ '+tier.level+'</span></div>';
  var pair=document.createElement('div'); pair.className='pair';
  tier.choices.forEach(function(p){
   var el=document.createElement('div');
   el.className='perk'+(selected[current][ti]===p.choice?' selected':'');
   var icon=p.icon?('<img class="icon" src="'+escapeHtml(p.icon)+'" alt=""/>'):'<div class="icon"></div>';
   el.innerHTML=icon+'<div class="choice">Вариант '+p.choice+'</div><div class="name">'+escapeHtml(p.name)+'</div><div class="desc">'+escapeHtml(p.desc)+'</div>';
   el.onclick=function(){selected[current][ti]=p.choice;render();};
   pair.appendChild(el);
  });
  row.appendChild(pair); box.appendChild(row);
 });
 update();
}
function update(){
 var b=selected[current].join('');
 document.getElementById('build').textContent=b;
 var cmd='!перки '+DATA[current].name+' '+b;
 document.getElementById('command').textContent=cmd;
}
function resetSkill(){selected[current].fill(0);render();document.getElementById('status').textContent='Выбор навыка сброшен.';}
function copyCommand(){copy(document.getElementById('command').textContent);}
function copyReset(){copy('!перки сброс '+DATA[current].name);}
function copy(t){navigator.clipboard.writeText(t).then(function(){document.getElementById('status').textContent='Скопировано.';});}
document.getElementById('search').oninput=function(e){renderSkills(e.target.value);};
renderSkills();render();

</script></body></html>
