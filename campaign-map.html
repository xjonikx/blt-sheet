var img=document.getElementById('map-image'),world=document.getElementById('map-world'),container=document.getElementById('map-container'),markers=document.getElementById('markers'),hud=document.getElementById('hud'),tip=document.getElementById('tooltip'),zoomLbl=document.getElementById('zoomLbl');
var scale=1,offX=20,offY=20,drag=false,moved=false,lx=0,ly=0,pid=null,ready=false,hudRaf=0,pendingHud=null;
function worldToPx(x,y){return [(x-minX)/(maxX-minX)*imgW,(1-(y-minY)/(maxY-minY))*imgH];}
function pxToWorld(px,py){return [minX+px/imgW*(maxX-minX),minY+(1-py/imgH)*(maxY-minY)];}
function applyTransform(){world.style.transform='translate('+offX+'px,'+offY+'px) scale('+scale+')';zoomLbl.textContent='Zoom '+Math.round(scale*100)+'%';}
function resetView(){var vw=Math.max(container.clientWidth||800,200),vh=Math.max(container.clientHeight||500,200);scale=Math.max(0.2,Math.min((vw-24)/imgW,(vh-24)/imgH));offX=12;offY=12;applyTransform();}
function zoomAt(f,cx,cy){var ox=(cx-offX)/scale,oy=(cy-offY)/scale;scale=Math.max(0.15,Math.min(16,scale*f));offX=cx-ox*scale;offY=cy-oy*scale;applyTransform();}
function zoomBy(f){var r=container.getBoundingClientRect();zoomAt(f,r.width*0.5,r.height*0.5);}
function showTip(html,x,y){tip.innerHTML=html;tip.style.display='block';var tw=340;if(x+tw>window.innerWidth)x=x-tw-12;if(y+140>window.innerHeight)y=window.innerHeight-150;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}
function applyFilter(){var q=(document.getElementById('q').value||'').toLowerCase();var tf=document.getElementById('typeFilter').value;var n=0;markers.querySelectorAll('.mk').forEach(function(el){var ok=(!q||(el.dataset.q||'').indexOf(q)>=0)&&(!tf||el.dataset.t===tf);el.classList.toggle('hidden',!ok);if(ok)n++;});document.getElementById('cnt').textContent=n+' shown';}
function buildMarkers(){
 markers.innerHTML='';
 settlements.forEach(function(s){
  var p=worldToPx(s.x,s.y);var el=document.createElement('div');
  el.className='mk '+s.t;el.style.left=p[0]+'px';el.style.top=p[1]+'px';
  el.dataset.t=s.t;el.dataset.q=(s.n+' '+s.id+' '+s.t).toLowerCase();
  el.addEventListener('mouseenter',function(e){showTip('<b>'+s.n+'</b><br/>'+s.t+'<br/>X '+s.x.toFixed(2)+' Y '+s.y.toFixed(2),e.clientX+12,e.clientY+12);});
  el.addEventListener('mousemove',function(e){showTip(tip.innerHTML,e.clientX+12,e.clientY+12);});
  el.addEventListener('mouseleave',hideTip);
  el.addEventListener('click',function(e){e.stopPropagation();var txt=s.x.toFixed(2)+' '+s.y.toFixed(2);hud.innerHTML='<b>'+s.n+'</b>  X '+s.x.toFixed(2)+'  Y '+s.y.toFixed(2);navigator.clipboard&&navigator.clipboard.writeText(txt);});
  markers.appendChild(el);
 });
 applyFilter();
}
function isBadAt(px,py){
 if(!badBits||!badBits.length)return false;
 var bx=Math.max(0,Math.min(badW-1,(px*badW/imgW)|0));
 var by=Math.max(0,Math.min(badH-1,(py*badH/imgH)|0));
 var bit=bx+by*badW;
 return (badBits[bit>>3]&(1<<(bit&7)))!==0;
}
function hudFor(px,py){
 var w=pxToWorld(px,py);
 var bad=isBadAt(px,py);
 return (bad?'<span class=bad>BAD</span> — непроходимо / нельзя строить':'<span class=ok>OK</span> — можно')
  +'  X '+w[0].toFixed(2)+'  Y '+w[1].toFixed(2);
}
img.onload=function(){ready=true;buildMarkers();resetView();};
img.onerror=function(){hud.innerHTML='<span class=bad>Failed to load map image</span>';};
img.src=terrainSrc;
function pointerPos(e){
 var rect=world.getBoundingClientRect();
 if(rect.width<1||rect.height<1)return[-1,-1];
 return [(e.clientX-rect.left)/rect.width*imgW,(e.clientY-rect.top)/rect.height*imgH];
}
function flushHud(){hudRaf=0;if(pendingHud){hud.innerHTML=pendingHud;pendingHud=null;}}
function scheduleHud(html){pendingHud=html;if(!hudRaf)hudRaf=requestAnimationFrame(flushHud);}
function endDrag(e){drag=false;container.classList.remove('dragging');var id=e&&e.pointerId!=null?e.pointerId:pid;pid=null;try{if(id!=null)container.releasePointerCapture(id);}catch(ex){}}
container.addEventListener('wheel',function(e){e.preventDefault();var r=container.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:0.89,e.clientX-r.left,e.clientY-r.top);},{passive:false});
container.addEventListener('pointerdown',function(e){if(e.button!==0)return;e.preventDefault();drag=true;moved=false;pid=e.pointerId;lx=e.clientX;ly=e.clientY;container.classList.add('dragging');try{container.setPointerCapture(e.pointerId);}catch(ex){}});
container.addEventListener('pointermove',function(e){
 if(drag){if((e.buttons&1)===0){endDrag(e);return;}var dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)>2||Math.abs(dy)>2)moved=true;offX+=dx;offY+=dy;lx=e.clientX;ly=e.clientY;applyTransform();return;}
 if(!ready)return;var p=pointerPos(e),px=p[0],py=p[1];
 if(px<0||py<0||px>=imgW||py>=imgH){scheduleHud('Наведите курсор на карту — OK/BAD и координаты X Y');return;}
 scheduleHud(hudFor(px,py));
});
function onPointerEnd(e){if(pid==null||e.pointerId===pid)endDrag(e);}
container.addEventListener('pointerup',onPointerEnd);container.addEventListener('pointercancel',onPointerEnd);
container.addEventListener('click',function(e){if(!ready||moved)return;var p=pointerPos(e);if(p[0]<0||p[1]<0||p[0]>=imgW||p[1]>=imgH)return;var w=pxToWorld(p[0],p[1]);var txt=w[0].toFixed(2)+' '+w[1].toFixed(2);scheduleHud(hudFor(p[0],p[1])+'  · copied');navigator.clipboard&&navigator.clipboard.writeText(txt);});
window.addEventListener('load',function(){setTimeout(resetView,0);});
